# ----------------------- #
#      Main Configs       #
# ----------------------- #

url: "https://zephyrtransport.org"

title: Zephyr

email: info@zephyrtransport.org
author: Elizabeth Sall
mission: Advancing transportation and land use planning and decision-making for the public good by advocating for and supporting community building, education, and shared standards.
vision: To be the primary venue where practitioners, researchers, and industry share credible, transparent, and reproducible methods and tools that enable equitable, sustainable transportation decisions.
values:
  - Respect
  - Collaboration
  - Inclusion
  - Honesty
  - Technical rigor
  - Community focus
copyright: "Copyright &copy; 2016-2026 Zephyr Foundation. All Rights Reserved."
credits: 'Credits: Landing Page is a free to use, open source Bootstrap theme created by <a href="http://startbootstrap.com/">Start Bootstrap</a>.'

