# ----------------------- #
#    Jekyll & Plugins     #
# ----------------------- #

# Build settings
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-redirect-from

# Retired/historical content kept in git history but not published
exclude:
  - archive
  - vendor
  - Gemfile
  - Gemfile.lock

