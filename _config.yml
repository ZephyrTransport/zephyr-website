url: "https://zephyrtransport.org"

title: Zephyr

email: info@zephyrtransport.org
author: Elizabeth Sall
mission: Advances rigorous transportation and land use planning and decision-making for the public good through building community, expanding knowledge, and promoting standards.
vision:
  - We envision a profession in which researchers, practitioners, and industry partners work together to develop and implement travel analysis data, methods, models, and tools that are demonstrably more valuable, credible, transparent, tractable, reproducible, and usable, enabling more inclusive decision-making and promoting equitable outcomes, shared prosperity, and sustainability.
values:
  - name: Respect
    description: We treat every member with professionalism, curiosity, and respect.
  - name: Collaboration
    description: We believe better solutions emerge through open exchange and shared effort.
  - name: Inclusion
    description: We welcome diverse perspectives, backgrounds, disciplines, and experience levels.
  - name: Integrity
    description: We communicate honestly, act ethically, and earn trust through transparency.
  - name: Technical Rigor
    description: We value evidence, reproducibility, sound methods, and continual improvement.
  - name: Community Stewardship
    description: We invest in the long-term health of the travel analysis community and the public good.
copyright: "Copyright &copy; 2016-2026 Zephyr Foundation. All Rights Reserved."
credits: 'Credits: Landing Page is a free to use, open source Bootstrap theme created by <a href="http://startbootstrap.com/">Start Bootstrap</a>.'

# Pillars used to categorize/filter the activities grid at /activities/.
# key must match a value in an activity's `pillars:` front matter list.
activity_pillars:
  - key: community
    title: Build Community
    icon: fa-users
    intro: "We connect people across academia, public agencies, consultancies, and technology providers to strengthen collaboration throughout the profession."
  - key: knowledge
    title: Expand Knowledge
    icon: fa-book-open
    intro: "We steward the profession's knowledge by helping the community discover, preserve, and share technical expertise and practical experience."
  - key: standards
    title: Promote Standards
    icon: fa-ruler-combined
    intro: "We improve professional practice by advancing open standards, shared tools, and best practices that make travel analysis more transparent, interoperable, and reproducible."

