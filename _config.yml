# Number of days ahead of today that count as "upcoming" on the events section
upcoming_events_window_days: 30

# Earliest year shown in the events archive year-by-year breakdown
events_earliest_year: 2017

collections:
  events:
    output: true
  programs:
    output: true
  trb17projects:
    output: true

# Pillars used to categorize/filter the programs grid at /programs/.
# key must match a value in a program's `pillars:` front matter list.
program_pillars:
  - key: community
    title: Community
    intro: Working groups, consortiums, and user groups that connect practitioners across agencies, academia, and industry.
  - key: education
    title: Education
    intro: Webinars, conferences, and working sessions that share practical travel-modeling knowledge.
  - key: standards
    title: Shared Standards
    intro: Data standards, specifications, and open-source tools that make travel analysis more transparent and reproducible.

