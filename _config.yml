events_earliest_year: 2017

collections:
  events:
    output: true
  activities:
    output: true
  events-recurring:
    output: true

# _events-recurring/*.md are recurring series (Board, Committee, activity calls,
# etc.) shown on the /events/ calendar. Each file's own content is a
# permanent info page (Zoom link, description) that occurrences link to.
# Front matter:
#   key:            unique slug, matched by an _events file's
#                   `recurring_series:` field to promote one occurrence
#   format:         what kind of gathering this is -- Reception, Meeting,
#                   Learning Session, Conference, Workshop, etc. This is
#                   the same field _events/*.md files use (the site's
#                   original `category:` field was split in two: it kept
#                   the name `category` for topic, and format-like values
#                   moved to this new `format:` field, since a lot of
#                   _events/*.md files already had an unrelated `type:`
#                   field used as a free-text subtitle badge on the event
#                   page -- don't reuse "type" for this).
#   category:       topic this is about -- Board, Membership, ActivitySim,
#                   DMDU, GMNS, MoMo, Open Science, TRB, etc. Used by the
#                   /events/ Category filter toggles.
#   also_categories: optional list of extra topics (e.g. a learning
#                   session that's both DMDU- and GMNS-related). Same
#                   optional field also works on _events/*.md files.
#   cadence:        "monthly_nth_weekday" or "weekly"
#   weekday:        0=Sun .. 6=Sat
#   nth:            (monthly_nth_weekday only) 1=1st, 2=2nd, etc.
#   interval_weeks: (weekly only) 1=every week, 2=every other week
#   start_date:     YYYY-MM-DD the series begins (also the biweekly
#                   parity anchor -- which Wednesdays count as "every
#                   other")
#   end_date:       optional YYYY-MM-DD the series stops recurring after.
#                   Omit for an ongoing series with no known end date.
#   time, place:    displayed on the series' own info page
#
# The /events/ calendar's month range isn't a fixed lookahead -- it
# renders from the current month through whichever is later: the
# furthest `end_date` among site.events-recurring, or the furthest scheduled
# one-off event in site.events. A series with no end_date doesn't by
# itself extend the range; it just keeps appearing in however many
# months something else (another series' end_date, or a real event)
# causes to render.
#
# To give one specific occurrence an agenda, recording, or cancellation
# notice, add a normal file to _events/ dated that occurrence with
# `recurring_series: <key>` in its front matter -- it replaces the
# generic calendar entry for that date instead of duplicating it.

