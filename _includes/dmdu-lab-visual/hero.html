  <div class="dlv-hero-inner">
    <div class="dlv-hero-eyebrow">Zephyr Foundation &middot; DMDU Initiative</div>

    <p class="dlv-hero-sub">{{ page.hero_sub | default: page.description }}</p>
    <a class="dlv-scroll-cue" href="#dlv-tiles">Explore the initiative &darr;</a>
  </div>
</section>
